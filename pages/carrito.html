
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrito</title>
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../CSS/style.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="carrito-body">

  <header>
  <div class="video-header">
    <video autoplay muted loop playsinline>
      <source src="../assets/Multimedia/video/Timemachinewebs.mp4" type="video/mp4">
      Tu navegador no soporta video HTML5.
    </video>
  </div>
  <div class="header-container">
    <div class="logo">
      <a href="../index.html">
        <img src="../assets/Multimedia/img/TMLogor.gif" alt="Logo Empresa Time Machine">
      </a>
    </div>
    <nav>
      <ul>
        <li><a href="../index.html" class="button">Inicio</a></li>
        <li><a href="../pages/productos.html" class="button">Productos</a></li>
        <li><a href="../pages/contacto.html" class="button">Contacto</a></li>
        <li>
          <a href="../pages/carrito.html" class="button">
            Carrito <span id="contador-carrito" class="contador-carrito">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

    <!-- Sección principal del carrito -->

  <section class="carrito-section">
    <div id="carrito-container"></div>

    <div id="total-carrito"></div>

    <div id="acciones-carrito">
      <button onclick="window.location.href='productos.html'" class="button">Seguir comprando</button>
      <button id="finalizar-compra" class="button">Finalizar compra</button>
    </div>
  </section>


  <!-- WhatsApp y Footer -->
  <a href="https://wa.me/1234567890" target="_blank" class="whatsapp-icon" aria-label="Chat por WhatsApp">
    <i class="fab fa-whatsapp" aria-hidden="true"></i>
  </a>

  <footer>
    <p>© 2025 Machine - Todos los derechos reservados - Time Machine</p>
  </footer>
  
<script>
  document.getElementById("finalizar-compra").addEventListener("click", () => {
    // Simular obtención del total desde tu lógica de carrito
    const totalTexto = document.getElementById("total-carrito").innerText;
    const total = parseFloat(totalTexto.replace(/[^0-9.]/g, '')) || 0;
    localStorage.setItem("carritoTotal", total.toFixed(2));
    window.location.href = "formularioPago.html";
  });
</script>
  <script src="../JS/carrito.js"></script>
</body>
</html>
